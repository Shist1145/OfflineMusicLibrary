name: Build OfflineMusicLibrary 1.7.0-preview.1

on:
  push:
    branches: [main]
    tags: [v1.7.0-preview.1]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  RELEASE_VERSION: 1.7.0-preview.1

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.x

      - name: Restore and build Windows app
        run: |
          dotnet restore src/OfflineMusicLibrary/OfflineMusicLibrary.csproj
          dotnet build src/OfflineMusicLibrary/OfflineMusicLibrary.csproj -c Release --no-restore

      - name: Run deterministic regression checks
        shell: pwsh
        run: |
          $projects = Get-ChildItem tests -Recurse -Filter *.csproj | Sort-Object FullName
          foreach ($project in $projects) {
            Write-Host "Running $($project.Directory.Name)"
            dotnet run --project $project.FullName -c Release
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Publish self-contained Windows x64 build
        shell: pwsh
        run: |
          $publishDir = "artifacts/windows"
          $archiveName = "OfflineMusicLibrary-$env:RELEASE_VERSION-windows-x64.zip"
          dotnet publish src/OfflineMusicLibrary/OfflineMusicLibrary.csproj `
            -c Release -r win-x64 --self-contained true `
            -p:DebugType=None -p:DebugSymbols=false `
            -o $publishDir
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (Get-Command py -ErrorAction SilentlyContinue) {
            py -3 packaging/create_windows_archive.py --source $publishDir --output "artifacts/$archiveName"
          } else {
            python packaging/create_windows_archive.py --source $publishDir --output "artifacts/$archiveName"
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $hash = (Get-FileHash "artifacts/$archiveName" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash *$archiveName" | Set-Content "artifacts/SHA256SUMS-$env:RELEASE_VERSION.txt" -Encoding ascii

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: OfflineMusicLibrary-${{ env.RELEASE_VERSION }}-windows-x64
          path: |
            artifacts/OfflineMusicLibrary-${{ env.RELEASE_VERSION }}-windows-x64.zip
            artifacts/SHA256SUMS-${{ env.RELEASE_VERSION }}.txt
          if-no-files-found: error

  cross-platform-source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.x
      - name: Verify cross-platform preview source
        run: dotnet build CrossPlatform/OfflineMusicLibrary.CrossPlatform.csproj -c Release
      - name: Run cross-platform NetEase regression checks
        run: dotnet run --project tests/NetEaseCrossPlatformChecks/NetEaseCrossPlatformChecks.csproj -c Release

  release:
    if: github.ref == 'refs/tags/v1.7.0-preview.1'
    needs: [windows, cross-platform-source]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: OfflineMusicLibrary-${{ env.RELEASE_VERSION }}-windows-x64
          path: artifacts
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: >-
          gh release create "$GITHUB_REF_NAME" artifacts/*
          --title "本地音乐库 ${{ env.RELEASE_VERSION }}"
          --notes-file RELEASE_NOTES.md
          --prerelease
